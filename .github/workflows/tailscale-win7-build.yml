name: Build Tailscale for Windows 7

on:
  push:
    branches:
      - tailscale-win7-build
    paths:
      - '.github/workflows/tailscale-win7-build.yml'
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: 'Tailscale tag to build'
        required: true
        default: 'v1.80.2'
        type: string

permissions:
  contents: read

jobs:
  build-win7:
    name: Win7 ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']

    env:
      TS_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tailscale_version || 'v1.80.2' }}

    steps:
      - name: Checkout Tailscale source
        uses: actions/checkout@v4
        with:
          repository: tailscale/tailscale
          ref: ${{ env.TS_VERSION }}
          path: tailscale-src
          fetch-depth: 1

      - name: Download Go legacy Win7 toolchain (latest Go 1.24.x)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/thongtech/go-legacy-win7/releases?per_page=100'
          asset_url="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "$api" |
            jq -r '[.[].assets[] | select(.name | test("^go-legacy-win7-1\\.24\\.[0-9]+-[0-9]+\\.linux_amd64\\.tar\\.gz$"))] | sort_by(.created_at) | reverse | .[0].browser_download_url // empty'
          )"

          if [[ -z "$asset_url" ]]; then
            echo 'No Go 1.24.x legacy Win7 Linux amd64 toolchain asset found.'
            exit 1
          fi

          echo "Using legacy toolchain: $asset_url"
          mkdir -p "$RUNNER_TEMP/go-legacy"
          curl -fL --retry 3 "$asset_url" -o "$RUNNER_TEMP/go-legacy.tar.gz"
          tar -xzf "$RUNNER_TEMP/go-legacy.tar.gz" -C "$RUNNER_TEMP/go-legacy"

          go_bin="$(find "$RUNNER_TEMP/go-legacy" -type f -path '*/bin/go' | head -n 1)"
          test -n "$go_bin"
          goroot="$(dirname "$(dirname "$go_bin")")"
          echo "GOROOT=$goroot" >> "$GITHUB_ENV"
          echo "$goroot/bin" >> "$GITHUB_PATH"

      - name: Verify legacy Go
        shell: bash
        run: |
          set -euo pipefail
          go version
          go env GOROOT GOHOSTOS GOHOSTARCH

      - name: Build Tailscale binaries
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cd tailscale-src
          mkdir -p "../dist-${GOARCH}"
          go mod download
          go build -trimpath -o "../dist-${GOARCH}/tailscale.exe" ./cmd/tailscale
          go build -trimpath -o "../dist-${GOARCH}/tailscaled.exe" ./cmd/tailscaled
          file "../dist-${GOARCH}/tailscale.exe" "../dist-${GOARCH}/tailscaled.exe"

      - name: Add official Wintun
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://www.wintun.net/builds/wintun-0.14.1.zip' -o "$RUNNER_TEMP/wintun.zip"
          unzip -q "$RUNNER_TEMP/wintun.zip" -d "$RUNNER_TEMP/wintun"
          if [[ '${{ matrix.arch }}' == 'amd64' ]]; then
            wt_arch='amd64'
          else
            wt_arch='x86'
          fi
          cp "$RUNNER_TEMP/wintun/wintun/bin/${wt_arch}/wintun.dll" "dist-${{ matrix.arch }}/wintun.dll"

      - name: Create Win7 install helpers
        shell: bash
        run: |
          set -euo pipefail
          out='dist-${{ matrix.arch }}'

          cat > "$out/install-service.cmd" <<'CMD'
          @echo off
          chcp 65001 >nul
          setlocal
          cd /d "%~dp0"
          net session >nul 2>&1
          if errorlevel 1 (
            echo [ERROR] Please run this file as Administrator.
            pause
            exit /b 1
          )
          if not exist tailscale.exe goto missing
          if not exist tailscaled.exe goto missing
          if not exist wintun.dll goto missing
          echo Installing Tailscale Windows service...
          sc stop Tailscale >nul 2>&1
          tailscaled.exe uninstall-system-daemon >nul 2>&1
          tailscaled.exe install-system-daemon
          if errorlevel 1 goto failed
          net start Tailscale
          if errorlevel 1 goto failed
          echo.
          echo Service started successfully.
          echo Run: tailscale.exe up
          echo For Headscale: tailscale.exe up --login-server=https://YOUR-HEADSCALE-SERVER
          pause
          exit /b 0
          :missing
          echo [ERROR] tailscale.exe, tailscaled.exe and wintun.dll must be in this folder.
          pause
          exit /b 1
          :failed
          echo [ERROR] Installation/start failed. Check Windows Event Viewer and C:\ProgramData\Tailscale\Logs
          pause
          exit /b 1
          CMD

          cat > "$out/uninstall-service.cmd" <<'CMD'
          @echo off
          chcp 65001 >nul
          setlocal
          cd /d "%~dp0"
          net session >nul 2>&1
          if errorlevel 1 (
            echo [ERROR] Please run this file as Administrator.
            pause
            exit /b 1
          )
          net stop Tailscale >nul 2>&1
          tailscaled.exe uninstall-system-daemon
          pause
          CMD

          cat > "$out/check-win7.cmd" <<'CMD'
          @echo off
          chcp 65001 >nul
          setlocal
          cd /d "%~dp0"
          echo ==== Windows ====
          ver
          wmic os get Caption,Version,OSArchitecture 2>nul
          echo.
          echo ==== Files ====
          for %%F in (tailscale.exe tailscaled.exe wintun.dll) do if exist "%%F" (echo [OK] %%F) else (echo [MISSING] %%F)
          echo.
          echo ==== Version ====
          tailscale.exe version
          tailscaled.exe --version
          echo.
          echo ==== Service ====
          sc query Tailscale
          echo.
          echo ==== Tailscale status ====
          tailscale.exe status
          pause
          CMD

          cat > "$out/README-WIN7.txt" <<EOF
          Tailscale ${TS_VERSION} custom build for Windows 7
          ==================================================

          Files:
            tailscale.exe
            tailscaled.exe
            wintun.dll (official Wintun 0.14.1)
            install-service.cmd
            uninstall-service.cmd
            check-win7.cmd
            SHA256SUMS.txt

          Recommended target: Tailscale v1.80.2.
          A public Tailscale issue reports v1.80.2 running normally on Windows 7
          after compilation with a Go 1.24 legacy-Win7 toolchain.

          GUI note:
          tailscale-ipn.exe is NOT included. Tailscale's Windows GUI wrapper is
          closed source, so custom public-source builds can provide tailscale.exe
          and tailscaled.exe but not the tray GUI.

          Installation:
          1. Windows 7 SP1 is recommended.
          2. Put all files in a simple local folder, for example C:\Tailscale-Win7
          3. Right-click install-service.cmd and Run as administrator.
          4. Open an elevated cmd.exe in this directory.
          5. For official Tailscale:
               tailscale.exe up
             For Headscale:
               tailscale.exe up --login-server=https://YOUR-HEADSCALE-SERVER
          6. Check with:
               tailscale.exe status
               tailscale.exe netcheck

          Windows 7 notes:
          - Tailscale's Win7 documentation mentions KB2921916.
          - If Wintun/driver signature installation fails, check SHA-2 signing
            support (notably KB4474419 and required servicing-stack updates).
          - Disable Tailscale self-update on this unsupported custom Win7 build.
          EOF

          (cd "$out" && sha256sum tailscale.exe tailscaled.exe wintun.dll > SHA256SUMS.txt)

      - name: Upload Win7 package
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-win7-${{ env.TS_VERSION }}-${{ matrix.arch }}
          path: dist-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30
